apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: frontend-ui
  namespace: clahanstore

spec:
  replicas: 2

  revisionHistoryLimit: 2

  selector:
    matchLabels:
      app: frontend-ui

  template:
    metadata:
      labels:
        app: frontend-ui

    spec:
      containers:
      - name: frontend-ui
        image: iyask/ai-service:v1.1.1
        ports:
        - containerPort: 80

  strategy:
    blueGreen:
      activeService: frontend-active
      previewService: frontend-preview
      autoPromotionEnabled: false

